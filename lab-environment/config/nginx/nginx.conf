worker_processes auto;
error_log /var/log/northstar-web/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Structured JSON logging for SIEM ingestion (SOC Standard)
    log_format soc_json escape=json
      '{'
        '"timestamp":"$time_iso8601",'
        '"host":"ns-web-01",'
        '"remote_addr":"$remote_addr",'
        '"src_ip":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time'
      '}';

    access_log /var/log/northstar-web/access.log soc_json;

    server {
        listen 80;
        server_name portal.northstar-fintech.local;

        location = / {
            default_type text/html;
            return 200 '<html><head><title>Northstar FinTech Portal</title></head><body><h1>Northstar FinTech — Customer Banking Portal</h1><p>Status: Operational</p></body></html>';
        }

        location = /health {
            return 200 '{"status":"ok","service":"ns-web-01"}';
        }

        location = /login {
            if ($request_method = POST) {
                return 401 '{"error":"invalid_credentials","service":"auth"}';
            }
            return 200 '{"page":"login","mfa_required":true}';
        }

        location = /api/v1/accounts {
            return 200 '{"accounts":[{"id":"acct-1001","status":"active"}]}';
        }

        location /admin {
            return 403 '{"error":"forbidden","message":"admin portal restricted to internal VPN"}';
        }

        location / {
            return 404 '{"error":"not_found"}';
        }
    }
}
